<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | KampusFind</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="reset-password-container">
      <div class="reset-password-card">
        <div class="reset-icon">🔐</div>

        <h1>Reset Your Password</h1>

        <p class="reset-subtitle">
          Create a new password for your KampusFind account.
        </p>

        <form id="resetPasswordForm">
          <div class="reset-input-group">
            <label for="newPassword">New Password</label>

            <div class="password-wrapper">
              <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                required
                minlength="6"
              />

              <button
                type="button"
                class="toggle-password"
                data-target="newPassword"
              >
                👁️
              </button>
            </div>
          </div>

          <div class="reset-input-group">
            <label for="confirmPassword">Confirm New Password</label>

            <div class="password-wrapper">
              <input
                type="password"
                id="confirmPassword"
                placeholder="Re-enter new password"
                required
                minlength="6"
              />

              <button
                type="button"
                class="toggle-password"
                data-target="confirmPassword"
              >
                👁️
              </button>
            </div>
          </div>

          <button type="submit" class="reset-submit-btn">
            Update Password
          </button>
        </form>

        <p id="resetMessage" class="reset-message"></p>
      </div>
    </main>

    <script type="module" src="js/reset-password.js"></script>
  </body>
</html>
